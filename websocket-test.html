<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Chat Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            height: 90vh;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 1s infinite;
        }

        .status-dot.connected {
            background: #44ff44;
        }

        .status-dot.connected {
            background: #44ff44;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .content {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 20px;
            padding: 20px;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.ai .message-bubble {
            background: #e0e0e0;
            color: #333;
        }

        .message.user .message-bubble {
            background: #667eea;
            color: white;
        }

        .message.system .message-bubble {
            background: #fff3cd;
            color: #856404;
            width: 100%;
            text-align: center;
            font-style: italic;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            max-height: 100px;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-area button:hover:not(:disabled) {
            background: #5568d3;
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .controls {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-section {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
        }

        .control-section h3 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 10px;
        }

        .control-section button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
            margin-bottom: 8px;
        }

        .control-section button:last-child {
            margin-bottom: 0;
        }

        .control-section button:hover:not(:disabled) {
            background: #5568d3;
        }

        .control-section button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stats {
            background: #f0f0f0;
            border-radius: 6px;
            padding: 10px;
            font-size: 12px;
            line-height: 1.6;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-label {
            font-weight: 500;
            color: #666;
        }

        .stat-value {
            color: #333;
            font-weight: 600;
        }

        .url-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #e0e0e0;
            border-radius: 12px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-10px); }
        }

        @media (max-width: 768px) {
            .content {
                flex-direction: column;
            }

            .controls {
                width: 100%;
            }

            .header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧪 WebSocket Chat Tester</h1>
            <div class="connection-status">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Disconnected</span>
            </div>
        </div>

        <div class="content">
            <div class="chat-section">
                <div class="messages" id="messages"></div>
                <div class="input-area">
                    <textarea id="input" placeholder="Type your message..." rows="3"></textarea>
                    <button onclick="sendMessage()" id="sendBtn">Send 📤</button>
                </div>
            </div>

            <div class="controls">
                <div class="control-section">
                    <h3>Server URL</h3>
                    <input type="text" id="urlInput" class="url-input" 
                           value="ws://localhost:8000/ws/ai/chat/"
                           placeholder="WebSocket URL">
                </div>

                <div class="control-section">
                    <h3>Connection</h3>
                    <button onclick="connectWebSocket()" id="connectBtn">Connect</button>
                    <button onclick="disconnectWebSocket()" id="disconnectBtn" disabled>Disconnect</button>
                </div>

                <div class="control-section">
                    <h3>Quick Tests</h3>
                    <button onclick="sendQuickMessage('Hello, how are you?')">Test 1: Hello</button>
                    <button onclick="sendQuickMessage('What can you help me with?')">Test 2: Help</button>
                    <button onclick="sendQuickMessage('')">Test 3: Empty (Error)</button>
                </div>

                <div class="control-section">
                    <h3>Stats</h3>
                    <div class="stats">
                        <div class="stat-row">
                            <span class="stat-label">Messages:</span>
                            <span class="stat-value" id="msgCount">0</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Tokens:</span>
                            <span class="stat-value" id="tokenCount">0</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Latency:</span>
                            <span class="stat-value" id="latency">-</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Status:</span>
                            <span class="stat-value" id="statusValue">Idle</span>
                        </div>
                    </div>
                </div>

                <div class="control-section">
                    <h3>Actions</h3>
                    <button onclick="clearMessages()">Clear Chat</button>
                    <button onclick="downloadLog()">Download Log</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let messageCount = 0;
        let tokenCount = 0;
        let sendTime = 0;
        let logs = [];

        function log(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] [${type}] ${message}`;
            logs.push(logEntry);
            console.log(logEntry);
        }

        function updateUI() {
            document.getElementById('msgCount').textContent = messageCount;
            document.getElementById('tokenCount').textContent = tokenCount;
        }

        function addMessage(type, content) {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;

            let bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = content;

            messageEl.appendChild(bubble);
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            if (type !== 'system') {
                messageCount++;
                updateUI();
            }
        }

        function addTypingIndicator() {
            const messagesDiv = document.getElementById('messages');
            const typing = document.createElement('div');
            typing.className = 'message ai';
            typing.id = 'typingIndicator';
            typing.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
            messagesDiv.appendChild(typing);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeTypingIndicator() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function connectWebSocket() {
            const url = document.getElementById('urlInput').value;
            if (!url) {
                alert('Please enter a WebSocket URL');
                return;
            }

            log('INFO', `Connecting to ${url}`);
            addMessage('system', 'Connecting to server...');

            ws = new WebSocket(url);

            ws.onopen = () => {
                log('CONNECT', 'WebSocket connected');
                addMessage('system', '✅ Connected to server');
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Connected';
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('statusValue').textContent = 'Connected';
                document.getElementById('input').focus();
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log('MESSAGE', JSON.stringify(data));

                    switch (data.type) {
                        case 'typing':
                            if (data.status === 'start') {
                                addTypingIndicator();
                                document.getElementById('statusValue').textContent = 'Typing...';
                            } else if (data.status === 'stop') {
                                removeTypingIndicator();
                                document.getElementById('statusValue').textContent = 'Connected';
                            }
                            break;

                        case 'token':
                            removeTypingIndicator();
                            addMessage('ai', data.text);
                            tokenCount++;
                            updateUI();
                            break;

                        case 'done':
                            removeTypingIndicator();
                            const latency = Date.now() - sendTime;
                            document.getElementById('latency').textContent = `${latency}ms`;
                            document.getElementById('statusValue').textContent = 'Ready';
                            log('DONE', `Response complete (${latency}ms)`);
                            break;

                        case 'error':
                            removeTypingIndicator();
                            addMessage('system', `❌ Error: ${data.error}`);
                            document.getElementById('statusValue').textContent = 'Error';
                            log('ERROR', data.error);
                            break;
                    }
                } catch (error) {
                    log('ERROR', `Parse error: ${error.message}`);
                }
            };

            ws.onerror = (error) => {
                log('ERROR', `WebSocket error: ${error}`);
                addMessage('system', '❌ Connection error');
                document.getElementById('statusValue').textContent = 'Error';
            };

            ws.onclose = () => {
                log('CLOSE', 'WebSocket closed');
                addMessage('system', '⚠️ Disconnected from server');
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Disconnected';
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                document.getElementById('statusValue').textContent = 'Disconnected';
                ws = null;
            };
        }

        function disconnectWebSocket() {
            if (ws) {
                ws.close();
                log('USER', 'User disconnected');
            }
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Not connected to server');
                return;
            }

            const input = document.getElementById('input');
            const message = input.value.trim();

            if (!message) {
                alert('Please enter a message');
                return;
            }

            addMessage('user', message);
            log('SEND', message);

            sendTime = Date.now();

            ws.send(JSON.stringify({
                question: message,
                document_id: null
            }));

            input.value = '';
            input.focus();
            document.getElementById('statusValue').textContent = 'Waiting...';
        }

        function sendQuickMessage(message) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('Not connected to server');
                return;
            }

            if (!message) {
                message = 'Test message';
            }

            document.getElementById('input').value = message;
            sendMessage();
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            messageCount = 0;
            tokenCount = 0;
            updateUI();
            log('USER', 'Chat cleared');
        }

        function downloadLog() {
            const content = logs.join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `websocket-test-${new Date().getTime()}.log`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Enter to send
        document.getElementById('input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Initial message
        addMessage('system', '👋 Welcome! Enter a WebSocket URL and click Connect to get started.');
        log('INIT', 'WebSocket tester initialized');
    </script>
</body>
</html>
